<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio7</title>
</head>

<body>
    <section>
        <div>
            <p id="texto">Lorem ipsum dolor sit amet consectetur adipisicing elit. Harum impedit eum, natus inventore
                corporis velit maiores adipisci accusamus necessitatibus. Iure, ipsum ut. Velit architecto voluptas
                itaque explicabo corporis accusamus illum.</p>
        </div>
        <button id="btn" onclick="cambiarEstado()">Ocultar</button>
    </section>
    <script>
        const parrafo = document.getElementById("texto")
        const boton = document.getElementById("btn")
        let visible = true
        function cambiarEstado() {
            if (visible) {
                boton.innerHTML = "Mostrar"
                parrafo.style.display = "none"
                visible = false
            }
            else {
                boton.innerHTML = "Ocultar"
                parrafo.style.display = "block"
                visible = true
            }
        }
    </script>
</body>

</html>

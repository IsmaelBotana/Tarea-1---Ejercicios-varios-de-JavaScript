<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio10</title>
    <style>
        .semaforo{
            display: flex;
            background-color: black;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            height: 100px;
        }
        .circulo{
            width: 50px;
            height: 50px;
            background-color: gainsboro;
            border-radius: 50px;
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="semaforo">
        <div id="rojo" class="circulo"></div>
        <div id="naranja" class="circulo"></div>
        <div id="verde" class="circulo"></div>
    </section>
    <h1 id="texto"></h1>
    <button id="btn" onclick="mostrarSiguiente()">Siguiente</button>
    <script>
        const parrafo = document.getElementById("texto")
        const rojo = document.getElementById("rojo")
        const naranja = document.getElementById("naranja")
        const verde = document.getElementById("verde")
        const estados = ["rojo", "naranja", "verde"]
        const colores = ["red", "orange", "green"]
        const textos = ["Stop", "Atención", "Adelante"]
        let estado = 0
        parrafo.innerHTML = textos[estado]
        rojo.style.backgroundColor = "red"
        function mostrarSiguiente() {
            estado = (estado + 1) % 3
            parrafo.innerHTML = textos[estado]
            rojo.style.backgroundColor = "gainsboro"
            naranja.style.backgroundColor = "gainsboro"
            verde.style.backgroundColor = "gainsboro"
            document.getElementById(estados[estado]).style.backgroundColor = colores[estado]
        }
    </script>
</body>

</html>

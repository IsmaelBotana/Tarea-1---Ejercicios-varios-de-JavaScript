<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <section>
        <div><p id="parrafoClicks"></p></div>
        <button id="btn" onclick="AumentarClicks()">Botón</button>
    </section>
    <script>
        const parrafo = document.getElementById("parrafoClicks")
        let contador = 0
        parrafo.innerHTML = contador;
        function AumentarClicks() {
            contador += 1
            parrafo.innerHTML = contador
        }
    </script>
</body>
</html>

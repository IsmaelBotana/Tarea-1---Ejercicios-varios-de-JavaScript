<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio4</title>
</head>

<body>
    <section>
        <div style="display: flex;">
            <p>Hora al momento de la ultima pulsación del botón: </p>
            <p id="resultado">Aún no se ha pulsado</p>
        </div>
        <button id="btn" onclick="mostrarMensaje()">Botón</button>
    </section>
    <script>
        const parrafo = document.getElementById("resultado")
        let ahora
        let hora
        function mostrarMensaje() {
            ahora = new Date()
            hora = ahora.toLocaleTimeString()
            parrafo.innerHTML = hora
        }
    </script>
</body>

</html>
